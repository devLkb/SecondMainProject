spring.application.name=backend

# MySQL DataSource (createDatabaseIfNotExist=true 로 DB 자동 생성)
spring.datasource.url=jdbc:mysql://localhost:3306/petchain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP - MySQL 초기화 대기 (docker compose 후 바로 실행해도 연결 실패 방지)
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# JPA / Hibernate (update: 엔티티 기반 테이블 자동 생성/갱신)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=petchain-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256-algo
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

server.port=8080
